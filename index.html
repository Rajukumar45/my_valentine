<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Anniversary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --pink-1: #ff9a9e;
  --pink-2: #fecfef;
  --rose: #ff4d6d;
  --rose-dark: #e63e5c;
  --lavender: #f3e7ff;
  --ink: #3a2e39;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: "Quicksand", system-ui, -apple-system, sans-serif;
  color: var(--ink);
  background-image:
              url("https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1600&q=80"),
              radial-gradient(circle at 20% 20%, var(--pink-2), transparent 40%),
              radial-gradient(circle at 80% 0%, #ffe6f2, transparent 45%),
              linear-gradient(135deg, var(--lavender), #ffe6ee 45%, #fff5f9);
  background-size: cover, auto, auto, auto;
  background-position: center, center, center, center;
  background-repeat: no-repeat;
  overflow: hidden;
}

.final-screen {
  background-image:
              radial-gradient(circle at 20% 20%, var(--pink-2), transparent 40%),
              radial-gradient(circle at 80% 0%, #ffe6f2, transparent 45%),
              linear-gradient(135deg, var(--lavender), #ffe6ee 45%, #fff5f9);
  background-size: auto, auto, auto;
  background-position: center, center, center;
  background-repeat: no-repeat;
  overflow: hidden;
}

.final-message {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 0;
  background: transparent;
  box-shadow: none;
}

.final-image {
  width: min(1000px, 94vw);
  max-height: 88vh;
  object-fit: contain;
  border-radius: 0;
  box-shadow: none;
  border: none;
}

.hearts {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.heart {
  position: absolute;
  width: 18px;
  height: 18px;
  background: var(--rose);
  transform: rotate(45deg);
  opacity: 0.3;
  animation: float 10s linear infinite;
}

.heart::before,
.heart::after {
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  background: var(--rose);
  border-radius: 50%;
}

.heart::before {
  left: -9px;
}

.heart::after {
  top: -9px;
}

@keyframes float {
  0% { transform: translateY(0) rotate(45deg); opacity: 0; }
  10% { opacity: 0.35; }
  100% { transform: translateY(-120vh) rotate(45deg); opacity: 0; }
}

.card {
  position: relative;
  z-index: 2;
  width: min(560px, 92vw);
  padding: 44px 36px 40px;
  border-radius: 28px;
  background: rgba(255, 255, 255, 0.72);
  box-shadow: 0 20px 60px rgba(255, 77, 109, 0.18), 0 6px 16px rgba(0, 0, 0, 0.08);
  backdrop-filter: blur(8px);
  text-align: center;
}

h1 {
  margin: 0 0 14px;
  font-family: "Pacifico", cursive;
  font-size: clamp(2rem, 3.5vw, 3rem);
  color: #d93158;
}

.subtitle {
  margin: 0 0 28px;
  font-size: 1.1rem;
  color: #6b4c5d;
}

.question-card {
  margin: 18px 0 28px;
  padding: 20px 18px;
  background: rgba(255, 255, 255, 0.8);
  border-radius: 18px;
  box-shadow: inset 0 0 0 1px rgba(244, 194, 215, 0.6);
}

.question-text {
  margin: 0;
  font-size: 1.2rem;
  font-weight: 600;
  color: #5c3c4a;
}

.question-count {
  margin-top: 10px;
  font-size: 0.95rem;
  color: #8b6a7b;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 18px;
  flex-wrap: wrap;
}

.final-media {
  margin-top: 22px;
  display: none;
  justify-content: center;
}

.final-media.is-visible {
  display: flex;
}

.final-media img,
.final-media video {
  width: min(320px, 80vw);
  border-radius: 22px;
  box-shadow: 0 14px 30px rgba(230, 62, 92, 0.25);
  border: 3px solid rgba(255, 255, 255, 0.8);
}

button {
  font-size: 1.05rem;
  padding: 12px 34px;
  border-radius: 999px;
  border: 1px solid #f06a93;
  cursor: pointer;
  font-weight: 700;
  letter-spacing: 0.2px;
  color: #fff;
  background: linear-gradient(180deg, #ff7fb0 0%, #ff5f99 45%, #f04886 100%);
  box-shadow:
    0 10px 18px rgba(240, 72, 134, 0.35),
    inset 0 1px 0 rgba(255, 255, 255, 0.7),
    inset 0 -2px 0 rgba(188, 25, 88, 0.35);
  text-shadow: 0 1px 0 rgba(132, 10, 59, 0.35);
  transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  position: relative;
  overflow: hidden;
  isolation: isolate;
}

button::before {
  content: "";
  position: absolute;
  inset: 2px 6px 55% 6px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0));
  opacity: 0.9;
  z-index: 0;
}

button:hover::before {
  opacity: 1;
}

button::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: inset 0 -4px 10px rgba(179, 22, 78, 0.4);
  opacity: 0.35;
  z-index: 0;
}

button span {
  position: relative;
  z-index: 1;
}

button:active {
  transform: translateY(1px) scale(0.99);
}

.btn-yes {
  background: linear-gradient(180deg, #ff7fb0 0%, #ff5f99 45%, #f04886 100%);
}

.btn-yes:hover {
  transform: translateY(-2px) scale(1.02);
  filter: brightness(1.03);
  box-shadow:
    0 14px 24px rgba(240, 72, 134, 0.45),
    inset 0 1px 0 rgba(255, 255, 255, 0.7),
    inset 0 -2px 0 rgba(188, 25, 88, 0.35);
}

.btn-no {
  background: linear-gradient(180deg, #ff86b6 0%, #ff6aa4 45%, #f45693 100%);
}

.btn-no:hover {
  transform: translateY(-2px) scale(1.02);
  filter: brightness(1.03);
  box-shadow:
    0 14px 24px rgba(240, 72, 134, 0.45),
    inset 0 1px 0 rgba(255, 255, 255, 0.7),
    inset 0 -2px 0 rgba(188, 25, 88, 0.35);
}

@media (max-width: 480px) {
  .card {
    padding: 34px 24px 32px;
  }

  .subtitle {
    font-size: 1rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  .heart {
    animation: none;
  }

  button {
    transition: none;
  }
}
</style>
</head>

<body>

<div class="hearts" aria-hidden="true">
  <span class="heart" style="left: 10%; animation-delay: 0s;"></span>
  <span class="heart" style="left: 25%; animation-delay: 2s; animation-duration: 12s;"></span>
  <span class="heart" style="left: 40%; animation-delay: 4s; animation-duration: 9s;"></span>
  <span class="heart" style="left: 60%; animation-delay: 1s; animation-duration: 11s;"></span>
  <span class="heart" style="left: 75%; animation-delay: 3s; animation-duration: 10s;"></span>
  <span class="heart" style="left: 90%; animation-delay: 5s; animation-duration: 13s;"></span>
</div>

<main class="card">
  <h1>Happy Engagement Anniversary! 💍❤️</h1>
  <p class="subtitle">Celebrating the promise we made and the love that keeps growing.</p>

  <div class="question-card" aria-live="polite">
    <p class="question-text" id="questionText"></p>
  </div>

  <div class="buttons">
    <button class="btn-no" id="rajBtn" onclick="chooseAnswer('Raj')"><span>Raj</span></button>
    <button class="btn-no" id="munnyBtn" onclick="chooseAnswer('Munny')"><span>Munny</span></button>
  </div>

  <div class="final-media" id="finalMedia" aria-hidden="true">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Animated_butterfly.gif" alt="Animated butterfly" loading="lazy">
  </div>
</main>

<script>
const questions = [
  "Who feels luckier? 🍀",
  "Who supports more?",
  "Who understands better?",
  "Who completes the other? 🤍",
  "Who loves more? ❤️"
];

let currentIndex = 0;

function renderQuestion() {
  const questionText = document.getElementById("questionText");

  questionText.textContent = questions[currentIndex];
}

function chooseAnswer(name) {
  if (currentIndex < questions.length - 1) {
    currentIndex += 1;
    renderQuestion();
    return;
  }
  document.body.classList.add("final-screen");
  document.body.innerHTML = "";

  const messageCard = document.createElement("div");
  messageCard.className = "final-message";

  const finalImage = document.createElement("img");
  finalImage.className = "final-image";
  finalImage.src = "anniversary-image.png";
  finalImage.alt = "Engagement anniversary message";
  finalImage.loading = "lazy";

  messageCard.appendChild(finalImage);

  document.body.appendChild(messageCard);
}

renderQuestion();
</script>

</body>
</html>
