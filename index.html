<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Anniversary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --pink-1: #ff9a9e;
  --pink-2: #fecfef;
  --rose: #ff4d6d;
  --rose-dark: #e63e5c;
  --lavender: #f3e7ff;
  --ink: #3a2e39;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: "Quicksand", system-ui, -apple-system, sans-serif;
  color: var(--ink);
  background-image:
              url("background.jpg"),
              radial-gradient(circle at 20% 20%, var(--pink-2), transparent 40%),
              radial-gradient(circle at 80% 0%, #ffe6f2, transparent 45%),
              linear-gradient(135deg, var(--lavender), #ffe6ee 45%, #fff5f9);
  background-size: cover, auto, auto, auto;
  background-position: center, center, center, center;
  background-repeat: no-repeat;
  overflow: hidden;
}

body.final-screen {
  background-image:
              radial-gradient(circle at 20% 20%, var(--pink-2), transparent 40%),
              radial-gradient(circle at 80% 0%, #ffe6f2, transparent 45%),
              linear-gradient(135deg, var(--lavender), #ffe6ee 45%, #fff5f9);
  background-size: auto, auto, auto;
  background-position: center, center, center;
  background-repeat: no-repeat;
  overflow-x: hidden;
  overflow-y: auto;
}

.final-message {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px 12px;
  background: transparent;
  box-shadow: none;
  gap: 16px;
}

.love-scroller {
  width: min(1240px, 96vw);
  overflow: hidden;
  border-radius: 999px;
  padding: 10px 0;
  background: rgba(255, 255, 255, 0.7);
  box-shadow: 0 10px 24px rgba(230, 62, 92, 0.18);
}

.love-track {
  display: flex;
  width: max-content;
  white-space: nowrap;
  animation: love-scroll 20s linear infinite;
  font-family: "Pacifico", cursive;
  font-size: clamp(1.2rem, 2.2vw, 1.7rem);
  color: #d93158;
}

.love-track span {
  display: inline-flex;
  padding-right: 0;
}

@keyframes love-scroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

.final-collage {
  display: grid;
  grid-template-columns: minmax(200px, 1fr) minmax(360px, 2fr) minmax(200px, 1fr);
  align-items: stretch;
  gap: 16px;
  width: min(1240px, 96vw);
  padding: 12px;
}

.final-column {
  display: grid;
  gap: 12px;
}

.final-photo {
  width: 100%;
  aspect-ratio: 5 / 4;
  object-fit: cover;
  object-position: center;
  border-radius: 16px;
  border: 3px solid rgba(255, 255, 255, 0.85);
  box-shadow: 0 12px 24px rgba(230, 62, 92, 0.2);
  background: rgba(255, 255, 255, 0.8);
  transform: scale(1.0);
}

.final-column:first-child .final-photo:nth-child(2) {
  object-position: 60% center;
}


.final-image {
  width: auto;
  height: 100%;
  max-width: 100%;
  object-fit: contain;
  border-radius: 0;
  box-shadow: none;
  border: none;
  transform: none;
  justify-self: center;
}

.hearts {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.heart {
  position: absolute;
  width: 18px;
  height: 18px;
  background: var(--rose);
  transform: rotate(45deg);
  opacity: 0.3;
  animation: float 10s linear infinite;
}

.heart::before,
.heart::after {
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  background: var(--rose);
  border-radius: 50%;
}

.heart::before {
  left: -9px;
}

.heart::after {
  top: -9px;
}

@keyframes float {
  0% { transform: translateY(0) rotate(45deg); opacity: 0; }
  10% { opacity: 0.35; }
  100% { transform: translateY(-120vh) rotate(45deg); opacity: 0; }
}

.card {
  position: relative;
  z-index: 2;
  width: min(560px, 92vw);
  padding: 44px 36px 40px;
  border-radius: 28px;
  background: rgba(255, 255, 255, 0.72);
  box-shadow: 0 20px 60px rgba(255, 77, 109, 0.18), 0 6px 16px rgba(0, 0, 0, 0.08);
  backdrop-filter: blur(8px);
  text-align: center;
}

h1 {
  margin: 0 0 14px;
  font-family: "Pacifico", cursive;
  font-size: clamp(2rem, 3.5vw, 3rem);
  color: #d93158;
}

.subtitle {
  margin: 0 0 28px;
  font-size: 1.1rem;
  color: #6b4c5d;
}

.question-card {
  margin: 18px 0 28px;
  padding: 20px 18px;
  background: rgba(255, 255, 255, 0.8);
  border-radius: 18px;
  box-shadow: inset 0 0 0 1px rgba(244, 194, 215, 0.6);
}

.question-text {
  margin: 0;
  font-size: 1.2rem;
  font-weight: 600;
  color: #5c3c4a;
}

.question-count {
  margin-top: 10px;
  font-size: 0.95rem;
  color: #8b6a7b;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 18px;
  flex-wrap: wrap;
}

.heart-gifs {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
  margin: 18px 0 10px;
}

.heart-gifs img {
  width: 96px;
  height: 96px;
  object-fit: contain;
  border-radius: 16px;
  overflow: hidden;
  background: transparent;
  filter: drop-shadow(0 10px 16px rgba(230, 62, 92, 0.25));
}

.final-media {
  margin-top: 22px;
  display: none;
  justify-content: center;
}

.final-media.is-visible {
  display: flex;
}

.final-media img,
.final-media video {
  width: min(320px, 80vw);
  border-radius: 22px;
  box-shadow: 0 14px 30px rgba(230, 62, 92, 0.25);
  border: 3px solid rgba(255, 255, 255, 0.8);
}

button {
  font-size: 1.05rem;
  padding: 12px 34px;
  border-radius: 999px;
  border: 1px solid #f06a93;
  cursor: pointer;
  font-weight: 700;
  letter-spacing: 0.2px;
  color: #fff;
  background: linear-gradient(180deg, #ff7fb0 0%, #ff5f99 45%, #f04886 100%);
  box-shadow:
    0 10px 18px rgba(240, 72, 134, 0.35),
    inset 0 1px 0 rgba(255, 255, 255, 0.7),
    inset 0 -2px 0 rgba(188, 25, 88, 0.35);
  text-shadow: 0 1px 0 rgba(132, 10, 59, 0.35);
  transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  position: relative;
  overflow: hidden;
  isolation: isolate;
}

button::before {
  content: "";
  position: absolute;
  inset: 2px 6px 55% 6px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0));
  opacity: 0.9;
  z-index: 0;
}

button:hover::before {
  opacity: 1;
}

button::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: inset 0 -4px 10px rgba(179, 22, 78, 0.4);
  opacity: 0.35;
  z-index: 0;
}

button span {
  position: relative;
  z-index: 1;
}

button:active {
  transform: translateY(1px) scale(0.99);
}

.btn-yes {
  background: linear-gradient(180deg, #ff7fb0 0%, #ff5f99 45%, #f04886 100%);
}

.btn-yes:hover {
  transform: translateY(-2px) scale(1.02);
  filter: brightness(1.03);
  box-shadow:
    0 14px 24px rgba(240, 72, 134, 0.45),
    inset 0 1px 0 rgba(255, 255, 255, 0.7),
    inset 0 -2px 0 rgba(188, 25, 88, 0.35);
}

.btn-no {
  background: linear-gradient(180deg, #ff86b6 0%, #ff6aa4 45%, #f45693 100%);
}

.btn-no:hover {
  transform: translateY(-2px) scale(1.02);
  filter: brightness(1.03);
  box-shadow:
    0 14px 24px rgba(240, 72, 134, 0.45),
    inset 0 1px 0 rgba(255, 255, 255, 0.7),
    inset 0 -2px 0 rgba(188, 25, 88, 0.35);
}

@media (max-width: 480px) {
  .card {
    padding: 34px 24px 32px;
  }

  .subtitle {
    font-size: 1rem;
  }

  .heart-gifs img {
    width: 84px;
    height: 84px;
  }
}

@media (max-width: 900px) {
  .final-collage {
    grid-template-columns: 1fr;
    align-items: center;
  }

  .final-column {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }

  .final-image {
    width: min(640px, 92vw);
    height: auto;
    transform: none;
  }

  .love-scroller {
    width: min(640px, 92vw);
  }
}

@media (prefers-reduced-motion: reduce) {
  .heart {
    animation: none;
  }

  button {
    transition: none;
  }
}
</style>
</head>

<body>

<div class="hearts" aria-hidden="true">
  <span class="heart" style="left: 10%; animation-delay: 0s;"></span>
  <span class="heart" style="left: 25%; animation-delay: 2s; animation-duration: 12s;"></span>
  <span class="heart" style="left: 40%; animation-delay: 4s; animation-duration: 9s;"></span>
  <span class="heart" style="left: 60%; animation-delay: 1s; animation-duration: 11s;"></span>
  <span class="heart" style="left: 75%; animation-delay: 3s; animation-duration: 10s;"></span>
  <span class="heart" style="left: 90%; animation-delay: 5s; animation-duration: 13s;"></span>
</div>

<main class="card">
  <h1>Happy Engagement Anniversary! 💍❤️</h1>
  <p class="subtitle">Celebrating the promise we made and the love that keeps growing.</p>

  <div class="heart-gifs" aria-hidden="true">
    <img class="heart-gif" src="heart.gif" data-fallback="https://media.giphy.com/media/l4pTdcifPZLpDjL1e/giphy.gif|https://media.tenor.com/1D1VgK7i8jUAAAAC/heart-love.gif|https://i.gifer.com/2Kbm.gif" alt="Animated heart" loading="lazy">
  </div>

  <div class="question-card" aria-live="polite">
    <p class="question-text" id="questionText"></p>
  </div>

  <div class="buttons">
    <button class="btn-no" id="rajBtn" onclick="chooseAnswer('Raj')"><span>Raj</span></button>
    <button class="btn-no" id="munnyBtn" onclick="chooseAnswer('Munny')"><span>Munny</span></button>
  </div>

  <div class="final-media" id="finalMedia" aria-hidden="true">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Animated_butterfly.gif" alt="Animated butterfly" loading="lazy">
  </div>
</main>

<script>
const questions = [
  "Who feels luckier? 🍀",
  "Who supports more?",
  "Who understands better?",
  "Who completes the other? 🤍",
  "Who loves more? ❤️"
];

let currentIndex = 0;

function attachHeartGifFallbacks() {
  const gifImages = document.querySelectorAll(".heart-gif");
  gifImages.forEach((img) => {
    const fallbackList = img.dataset.fallback ? img.dataset.fallback.split("|") : [];
    const sources = [img.getAttribute("src"), ...fallbackList].filter(Boolean);
    let sourceIndex = 0;

    img.addEventListener("error", () => {
      sourceIndex += 1;
      if (sourceIndex < sources.length) {
        img.src = sources[sourceIndex];
      }
    });
  });
}

function renderQuestion() {
  const questionText = document.getElementById("questionText");

  questionText.textContent = questions[currentIndex];
}

function chooseAnswer(name) {
  if (currentIndex < questions.length - 1) {
    currentIndex += 1;
    renderQuestion();
    return;
  }
  document.body.classList.add("final-screen");
  document.body.innerHTML = "";

  const messageCard = document.createElement("div");
  messageCard.className = "final-message";

  const topScroller = document.createElement("div");
  topScroller.className = "love-scroller";
  topScroller.setAttribute("aria-hidden", "true");

  const topTrack = document.createElement("div");
  topTrack.className = "love-track";
  const trackText = "I love you, my wife ❤️ ".repeat(12);
  const spanOne = document.createElement("span");
  spanOne.textContent = trackText;
  const spanTwo = document.createElement("span");
  spanTwo.textContent = trackText;
  topTrack.appendChild(spanOne);
  topTrack.appendChild(spanTwo);
  topScroller.appendChild(topTrack);

  const collage = document.createElement("div");
  collage.className = "final-collage";

  const leftColumn = document.createElement("div");
  leftColumn.className = "final-column";

  const rightColumn = document.createElement("div");
  rightColumn.className = "final-column";

  const finalImage = document.createElement("img");
  finalImage.className = "final-image";
  finalImage.src = "anniversary-image.png";
  finalImage.alt = "Engagement anniversary message";
  finalImage.loading = "lazy";

  const leftImages = ["IMG_3507.jpeg", "IMG_4069.jpeg"];
  const rightImages = ["IMG_3850.jpeg", "IMG_3964.jpeg"];

  leftImages.forEach((src) => {
    const img = document.createElement("img");
    img.className = "final-photo";
    img.src = src;
    img.alt = "Anniversary memory";
    img.loading = "lazy";
    leftColumn.appendChild(img);
  });

  rightImages.forEach((src) => {
    const img = document.createElement("img");
    img.className = "final-photo";
    img.src = src;
    img.alt = "Anniversary memory";
    img.loading = "lazy";
    rightColumn.appendChild(img);
  });

  collage.appendChild(leftColumn);
  collage.appendChild(finalImage);
  collage.appendChild(rightColumn);
  messageCard.appendChild(topScroller);
  messageCard.appendChild(collage);

  document.body.appendChild(messageCard);
}

renderQuestion();
attachHeartGifFallbacks();
</script>

</body>
</html>
