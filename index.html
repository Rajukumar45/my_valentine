<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Be My Valentine?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --pink-1: #ff9a9e;
  --pink-2: #fecfef;
  --rose: #ff4d6d;
  --rose-dark: #e63e5c;
  --lavender: #f3e7ff;
  --ink: #3a2e39;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: "Quicksand", system-ui, -apple-system, sans-serif;
  color: var(--ink);
  background: radial-gradient(circle at 20% 20%, var(--pink-2), transparent 40%),
              radial-gradient(circle at 80% 0%, #ffe6f2, transparent 45%),
              linear-gradient(135deg, var(--lavender), #ffe6ee 45%, #fff5f9);
  overflow: hidden;
}

.hearts {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.heart {
  position: absolute;
  width: 18px;
  height: 18px;
  background: var(--rose);
  transform: rotate(45deg);
  opacity: 0.3;
  animation: float 10s linear infinite;
}

.heart::before,
.heart::after {
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  background: var(--rose);
  border-radius: 50%;
}

.heart::before {
  left: -9px;
}

.heart::after {
  top: -9px;
}

@keyframes float {
  0% { transform: translateY(0) rotate(45deg); opacity: 0; }
  10% { opacity: 0.35; }
  100% { transform: translateY(-120vh) rotate(45deg); opacity: 0; }
}

.card {
  position: relative;
  z-index: 2;
  width: min(560px, 92vw);
  padding: 44px 36px 40px;
  border-radius: 28px;
  background: rgba(255, 255, 255, 0.72);
  box-shadow: 0 20px 60px rgba(255, 77, 109, 0.18), 0 6px 16px rgba(0, 0, 0, 0.08);
  backdrop-filter: blur(8px);
  text-align: center;
}

h1 {
  margin: 0 0 14px;
  font-family: "Pacifico", cursive;
  font-size: clamp(2rem, 3.5vw, 3rem);
  color: #d93158;
}

.subtitle {
  margin: 0 0 28px;
  font-size: 1.1rem;
  color: #6b4c5d;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 18px;
  flex-wrap: wrap;
}

button {
  font-size: 1.05rem;
  padding: 12px 28px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.btn-yes {
  background: linear-gradient(135deg, var(--rose), var(--rose-dark));
  color: var(--white);
  box-shadow: 0 10px 20px rgba(230, 62, 92, 0.3);
}

.btn-yes:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 14px 26px rgba(230, 62, 92, 0.38);
}

.btn-no {
  background: rgba(255, 255, 255, 0.9);
  color: #7b5e6b;
  border: 2px solid #f4c2d7;
  box-shadow: 0 8px 16px rgba(123, 94, 107, 0.12);
}

.btn-no:hover {
  transform: translateY(-1px);
}

@media (max-width: 480px) {
  .card {
    padding: 34px 24px 32px;
  }

  .subtitle {
    font-size: 1rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  .heart {
    animation: none;
  }

  button {
    transition: none;
  }
}
</style>
</head>

<body>

<div class="hearts" aria-hidden="true">
  <span class="heart" style="left: 10%; animation-delay: 0s;"></span>
  <span class="heart" style="left: 25%; animation-delay: 2s; animation-duration: 12s;"></span>
  <span class="heart" style="left: 40%; animation-delay: 4s; animation-duration: 9s;"></span>
  <span class="heart" style="left: 60%; animation-delay: 1s; animation-duration: 11s;"></span>
  <span class="heart" style="left: 75%; animation-delay: 3s; animation-duration: 10s;"></span>
  <span class="heart" style="left: 90%; animation-delay: 5s; animation-duration: 13s;"></span>
</div>

<main class="card">
  <h1>Will you be my Valentine? ❤️</h1>
  <p class="subtitle">A tiny question with a big smile behind it.</p>

  <div class="buttons">
    <button class="btn-yes" onclick="yesClick()">Yes</button>
    <button class="btn-no" id="no" onmouseover="moveNo()">No</button>
  </div>
</main>

<script>
function yesClick() {
  alert("Yay!!! ❤️🥰");
}

function moveNo() {
  const noButton = document.getElementById("no");
  const padding = 16;
  const maxX = window.innerWidth - noButton.offsetWidth - padding;
  const maxY = window.innerHeight - noButton.offsetHeight - padding;
  const x = Math.random() * Math.max(maxX, 0);
  const y = Math.random() * Math.max(maxY, 0);
  noButton.style.position = "fixed";
  noButton.style.left = x + "px";
  noButton.style.top = y + "px";
}
</script>

</body>
</html>
